<!DOCTYPE html>
<html data-theme="dark" lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f59e0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BuildPro">
<title data-i18n="sayfa_bulunamadı">BuildPro — Sayfa Bulunamadı</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="css/main.css" rel="stylesheet"/>
<style>
.error-page {
  font-family:'Inter',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:80px 24px;
  position:relative;
  overflow:hidden;
}
.error-bg {
  position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(20,184,166,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(245,158,11,0.05) 0%, transparent 50%),
    var(--bg-primary);
}
.error-content { position:relative; z-index:10; max-width:600px; }
.error-emoji {
  font-size:6rem;
  margin-bottom:24px;
  display:inline-block;
  animation:emojiBounce 2s ease-in-out infinite;
}
@keyframes emojiBounce {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-12px); }
}
.error-code {
  font-size:8rem;
  font-weight:800;
  line-height:1;
  margin-bottom:16px;
  background:linear-gradient(135deg,var(--teal-400),var(--amber-400));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:-0.05em;
}
.error-title {
  font-size:clamp(1.5rem,3vw,2rem);
  font-weight:700;
  color:var(--text-primary);
  margin-bottom:12px;
}
.error-desc {
  font-size:var(--text-lg);
  color:var(--text-muted);
  margin-bottom:32px;
  line-height:1.6;
}
.error-langs {
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:32px;
}
.error-lang-tag {
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius-lg);
  padding:8px 16px;
  font-size:var(--text-sm);
  color:var(--text-muted);
}
.error-lang-tag.active {
  border-color:var(--teal-500);
  color:var(--teal-400);
}
.error-btn {
  display:inline-flex;
  align-items:center;
  gap:10px;
  background:var(--teal-500);
  color:#0f172a;
  padding:14px 28px;
  border-radius:var(--radius-lg);
  font-weight:600;
  font-size:var(--text-base);
  text-decoration:none;
  transition:all var(--duration-fast);
}
.error-btn:hover {
  background:var(--teal-400);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(20,184,166,0.25);
}
.error-footer {
  margin-top:48px;
  font-size:var(--text-sm);
  color:var(--text-muted);
}
.error-dots {
  display:flex;
  gap:8px;
  justify-content:center;
  margin-top:16px;
}
.error-dot {
  width:8px; height:8px;
  background:var(--border-color);
  border-radius:50%;
  animation:dotPulse 1.5s ease-in-out infinite;
}
.error-dot:nth-child(2) { animation-delay:0.3s; }
.error-dot:nth-child(3) { animation-delay:0.6s; }
@keyframes dotPulse {
  0%,100% { opacity:0.3; transform:scale(1); }
  50% { opacity:1; transform:scale(1.3); }
}
</style>
</head>
<body class="error-page">
<div class="error-bg"></div>
<div class="error-content">
  <div class="error-emoji">🏗️⚠️</div>
  <div class="error-code">404</div>
  <h1 class="error-title" data-i18n="sayfa_bulunamadı">Sayfa Bulunamadı</h1>
  <div class="error-langs">
    <span class="error-lang-tag active" data-i18n="tr_404">Sayfa Bulunamadı</span>
    <span class="error-lang-tag" data-i18n="en_404">Page Not Found</span>
    <span class="error-lang-tag" data-i18n="nl_404">Pagina Niet Gevonden</span>
  </div>
  <p class="error-desc" data-i18n="404_açıklama">
    Aradığınız sayfa inşaat halinde olabilir, taşınmış olabilir veya hiç var olmamış olabilir.
    <br/>Endişelenmeyin, sizi güvenli bir alana yönlendirebiliriz.
  </p>
  <a class="error-btn" href="dashboard.html" data-i18n="dashboard_a_dön">
    <span>🏠</span>
    <span>Dashboard'a Dön</span>
  </a>
  <div class="error-footer">
    <span data-i18n="buildpro_yapı_yönetimi">BuildPro Yapı Yönetimi</span>
    <div class="error-dots">
      <span class="error-dot"></span>
      <span class="error-dot"></span>
      <span class="error-dot"></span>
    </div>
  </div>
</div>
<script>
window.onerror = function(msg, url, line) {
  console.error('BuildPro Error:', msg, 'at', url, ':' , line);
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  console.error('Unhandled Promise:', e.reason);
});
</script>
<script src="js/pwa.js"></script>
</body>
</html>
